name: Readiness regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install flask pyyaml -r docs/sdk/python/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: docs/sdk
      - run: npm ci --ignore-scripts
        working-directory: tests
      - run: npm ci --ignore-scripts
        working-directory: subscriber-core/admin
      - run: npm run build && npm audit --audit-level=moderate
        working-directory: subscriber-core/admin
      - run: npm ci --ignore-scripts
        working-directory: provider-core/admin
      - run: npm run build && npm audit --audit-level=moderate
        working-directory: provider-core/admin
      - run: python -m unittest discover -s tests -v
      - run: node --test docs/sdk/client.test.mjs tests/*.test.mjs
